<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>STEP 04 – One Last Thing</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:'Inter',sans-serif;background:#0b0f19;color:#f1f5f9;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow-x:hidden;position:relative}
    /* Preloader (kept identical to original design) */
    #preloader{position:fixed;top:0;left:0;width:100%;height:100%;background:#0b0f19;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:9999;transition:opacity .5s ease,visibility .5s ease}
    #preloader.fade-out{opacity:0;visibility:hidden}
    .loader-spinner{width:48px;height:48px;border:3px solid rgba(255,255,255,.1);border-top:3px solid #38bdf8;border-radius:50%;animation:spin 1s linear infinite;margin-bottom:16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader-text{font-family:'JetBrains Mono',monospace;font-size:.9rem;color:#94a3b8;letter-spacing:1px}
    .glow{position:absolute;width:500px;height:500px;background:radial-gradient(circle,rgba(56,189,248,.12) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:1}
    .card{background:rgba(17,24,39,.85);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(12px);border-radius:20px;padding:48px 40px;max-width:520px;width:90%;text-align:center;position:relative;z-index:2;box-shadow:0 25px 50px -12px rgba(0,0,0,.6);animation:fadeIn .6s ease-out}
    @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
    .step-badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.8rem;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:#38bdf8;background:rgba(56,189,248,.1);border:1px solid rgba(56,189,248,.25);padding:6px 16px;border-radius:9999px;margin-bottom:24px}
    .main-title{font-size:2.4rem;font-weight:800;color:#fff;margin-bottom:12px;letter-spacing:-.5px}
    .subtitle{font-size:1.15rem;color:#94a3b8;margin-bottom:36px;line-height:1.5}
    .action-container{display:flex;flex-direction:column;align-items:center;gap:16px}
    .cta-button{display:inline-flex;align-items:center;justify-content:center;width:100%;padding:16px 28px;font-size:1.05rem;font-weight:700;font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:1px;text-decoration:none;color:#0b0f19;background:#fff;border:none;border-radius:12px;cursor:pointer;transition:all .2s ease;box-shadow:0 4px 15px rgba(255,255,255,.15)}
    .cta-button:hover{background:#38bdf8;color:#0b0f19;transform:translateY(-2px);box-shadow:0 8px 25px rgba(56,189,248,.35)}
    .cta-button:active{transform:translateY(0)}
    .trust-text{font-family:'JetBrains Mono',monospace;font-size:.85rem;color:#64748b;font-style:italic}
  </style>
</head>
<body>
  <!-- Preloader (unchanged) -->
  <div id="preloader">
    <div class="loader-spinner"></div>
    <div class="loader-text">PREPARING SOMETHING SPECIAL...</div>
  </div>

  <div class="glow"></div>

  <main class="card">
    <div class="step-badge">STEP 04</div>
    <h1 class="main-title">Ek last thing.</h1>
    <p class="subtitle">Bas ek aur click. Pakka.</p>
    <div class="action-container">
      <a href="complaint.html" class="cta-button" id="lastClickBtn">THE LAST CLICK →</a>
      <p class="trust-text">Trust me. I'm a developer.</p>
    </div>
  </main>

  <script>
    // Hide preloader after page loads
    window.addEventListener('load',()=>{
      const preloader=document.getElementById('preloader');
      setTimeout(()=>{preloader.classList.add('fade-out');},600);
    });
  </script>
</body>
</html>
